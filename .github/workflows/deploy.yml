name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # wrangler types / vitest / tsc only need the *shape* of Env (the key
      # names), not real secret values. Real secrets live only in Cloudflare
      # (set via `wrangler secret put` / sync-secrets.sh) and are never
      # touched by this workflow.
      - run: cp .env.example .env

      - run: pnpm test

      - run: pnpm typecheck

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # PUTs the full command list declaratively — safe to run on every
      # deploy even when nothing changed (process.loadEnvFile in the script
      # does not override these real secrets with the dummy .env above).
      - name: Register Discord slash commands
        run: node --experimental-strip-types scripts/register-commands.ts
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
