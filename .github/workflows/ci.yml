name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # wrangler types / vitest / tsc only need the *shape* of Env (the key
      # names), not real secret values.
      - run: cp .env.example .env

      - run: pnpm test

      - run: pnpm typecheck
